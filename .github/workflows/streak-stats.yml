name: Generate streak stats

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: Harsh-Codes-77
          theme: github-dark
          hide_border: false
          border_radius: 5
          locale: en
          mode: daily
          output_file: streak-stats.svg

      - name: Create dist directory and move SVG
        run: |
          mkdir -p dist
          mv streak-stats.svg dist/ || true

      - name: Push streak-stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
